name: F-004 KMI del fragmento SIAO
on:
  push:
    branches: ['titan/f-004-kmi']
    paths: ['tools/f004_kmi.py', '.github/workflows/f-004-kmi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: build-${{ matrix.brazo }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        brazo: [baseline, siao]
    steps:
      - uses: actions/checkout@v4
      - name: Identificar la maquina, verbatim
        run: |
          set -x
          uname -a
          nproc
          free -m
          df -h /
      - name: md5 del instrumento
        run: md5sum tools/f004_kmi.py
      - name: Herramientas de kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm bc bison flex libssl-dev libelf-dev python3 rsync kmod cpio zstd
          clang --version | head -2
          ld.lld --version | head -1
          make --version | head -1
      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: No ocultar el primer error del kernel
        run: |
          python3 - <<'PY'
          p = 'tools/f004_kmi.py'
          s = open(p).read()
          old = '2>&1 | tail -40'
          if old not in s:
              raise SystemExit('no encontre el pipeline tail en el instrumento')
          open(p, 'w').write(s.replace(old, '2>&1'))
          PY
      - name: Compilar ${{ matrix.brazo }}
        if: always()
        env:
          F004_OUT: mediciones/f-004
          F004_WORK: /tmp/f004
          F004_RAMA: android15-6.6
        run: python3 tools/f004_kmi.py build ${{ matrix.brazo }}
      - name: Extraer error crudo
        if: always()
        run: |
          f=mediciones/f-004/f004-${{ matrix.brazo }}-build.txt
          echo '### diagnostico preservado' >> "$f"
          grep -nE 'error:|Error [0-9]|No such file|Killed|No space|undefined reference|FAILED|fatal' "$f" | tail -80 | tee -a "$f" || true
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f004-${{ matrix.brazo }}
          path: mediciones/f-004/
          retention-days: 5
          if-no-files-found: warn
  comparar:
    name: comparar-KMI
    needs: build
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bajar los dos brazos
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: Juntarlos
        run: |
          mkdir -p mediciones/f-004
          cp -v /tmp/artifacts/*/* mediciones/f-004/ 2>/dev/null || true
          ls -la mediciones/f-004/
      - name: Comparar los Module.symvers
        env:
          F004_OUT: mediciones/f-004
          F004_RAMA: android15-6.6
        run: python3 tools/f004_kmi.py comparar || true
      - name: Commitear la evidencia
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mediciones
          git diff --cached --quiet && exit 0
          git commit -m "evidencia(f-004): KMI por Module.symvers (run ${{ github.run_id }})"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Resumen
        if: always()
        run: cat mediciones/f-004/F-004.md >> "$GITHUB_STEP_SUMMARY" || true

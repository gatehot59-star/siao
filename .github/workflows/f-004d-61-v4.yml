name: F-004d@6.1 v4 - rebuild del brazo ocho CON el Image

# POR QUE ESTE RUN EXISTE, en una linea: el v3 compilaba 'Image modules' y
# empaquetaba solo vmlinux + .ko, asi que 'arch/arm64/boot/Image' -- el unico
# artefacto ARRANCABLE de todo el build -- se tiraba con el directorio de
# trabajo. Lo encontro FABLE 5.1 auditando el codigo, no la salida (H-2), y sin
# ese archivo F-001-S2 no es ejecutable.
#
# QUE MIDE: que el brazo 'ocho' produzca vmlinux, Module.symvers Y el Image, que
# el KAT de objcopy los cruce IDENTICO, y que el tarball los contenga a los dos.
# NO re-mide la ABI: eso ya esta VERDE en 68 B y no se toca en este run.
#
# EL BANCO CORRE PRIMERO, y no es ceremonia: en su primera pasada encontro un bug
# mio en el v4 (regex '\./?vmlinux' con el punto obligatorio) que habria abortado
# el job en falso DESPUES de dos horas de build. Ahora corre en el runner tambien,
# porque un banco cuyo unico testigo es la maquina del autor no es un testigo.
on:
  push:
    branches: ['titan/f-004d-61-v4-empaqueta-Image']
    paths:
      - '.github/workflows/f-004d-61-v4.yml'
      - 'tools/f004d61_build.py'
      - 'tools/test_f004d61_empaquetado.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ocho:
    name: f004d61v4-ocho
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Identificar la maquina, verbatim
        run: |
          set -x
          uname -a
          nproc
          free -m
          df -h /

      - name: md5 de los DOS instrumentos que se van a usar
        run: md5sum tools/f004d61_build.py tools/test_f004d61_empaquetado.py

      - name: Herramientas de kernel con pahole
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm bc bison flex libssl-dev libelf-dev python3 rsync kmod cpio zstd dwarves
          echo "pahole      -> $(command -v pahole || echo AUSENTE)"
          echo "llvm-objcopy-> $(command -v llvm-objcopy || echo AUSENTE)"
          echo "objcopy     -> $(command -v objcopy || echo AUSENTE)"
          pahole --version 2>&1 | head -1 || true

      # GATE: si el empaquetado esta roto, no gastamos 2 h de build para
      # descubrirlo en el ultimo paso. Y su salida queda commiteada como
      # evidencia de un SEGUNDO testigo, que no es brain-env.
      - name: GATE - banco de pruebas del empaquetado (33 casos)
        run: |
          mkdir -p mediciones/f-004d-61
          set -o pipefail
          python3 tools/test_f004d61_empaquetado.py 2>&1 | tee mediciones/f-004d-61/v4-banco-en-el-runner.txt

      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Compilar el brazo ocho
        env:
          F004_OUT: mediciones/f-004d-61
          F004_WORK: /tmp/f004d61
          F004_RAMA: android14-6.1
        run: python3 tools/f004d61_build.py ocho

      # El Image y el vmlinux son BINARIOS: van al artifact, jamas a git.
      # A git van sus sha256 y bytes, que es lo que conserva la identidad.
      - name: Subir el tarball CON el Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f004d61v4-ocho-elf
          path: mediciones/f-004d-61/elf-ocho-android14-6.1.tar.zst
          retention-days: 30
          if-no-files-found: warn

      - name: Subir la evidencia de texto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f004d61v4-ocho-texto
          path: |
            mediciones/f-004d-61/v4-*
          retention-days: 30
          if-no-files-found: warn

      - name: Que quedo, medido y no supuesto
        if: always()
        run: |
          set -x
          ls -la mediciones/f-004d-61/ | tail -20
          test -f mediciones/f-004d-61/v4-ocho.json && cat mediciones/f-004d-61/v4-ocho.json || echo 'SIN v4-ocho.json'

      - name: Commitear la evidencia de TEXTO (los binarios no)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f mediciones/f-004d-61/elf-*.tar.zst mediciones/f-004d-61/elf-*.lista
          git add -A mediciones/f-004d-61
          git diff --cached --quiet && exit 0
          git commit -m "evidencia(F-004d@6.1 v4): brazo ocho CON Image (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin titan/f-004d-61-v4-empaqueta-Image && git push origin HEAD:titan/f-004d-61-v4-empaqueta-Image && exit 0
            sleep $((i * 8))
          done
          exit 1

      - name: Resumen a la cara de quien decide
        if: always()
        run: |
          {
            echo '## F-004d@6.1 v4 - brazo ocho'
            echo '### banco de empaquetado en el runner'
            grep -E 'RESULTADO|FALLA' mediciones/f-004d-61/v4-banco-en-el-runner.txt || echo 'sin banco'
            echo '### los tres artefactos y el KAT'
            grep -E 'presente|KAT ->|sha256 (vmlinux|Image)|contiene vmlinux|n_modulos|precondicion' mediciones/f-004d-61/v4-ocho-bitacora.txt || echo 'sin bitacora'
            echo '### veredicto'
            python3 -c "import json;print(json.load(open('mediciones/f-004d-61/v4-ocho.json'))['veredicto'])" || echo 'sin json'
          } >> "$GITHUB_STEP_SUMMARY"

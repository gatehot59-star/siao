name: F-004d en android14-6.1

# D9 del auditor: el dispositivo de referencia es Pixel 8/8a, generacion android14-6.1.
# R-17: un resultado de una generacion NO se cita para otra. Por eso este run compila
# SU PROPIO baseline en 6.1: el baseline.stg de f-004b es de 6.6 y NO es transferible.
#
# PRE-VUELO YA MEDIDO (cero builds, en brain-env):
#   android14-6.1 gki_defconfig -> CONFIG_POSIX_MQUEUE=y  YA PRENDIDO
#   android15-6.6 gki_defconfig -> CONFIG_POSIX_MQUEUE     ausente
#   O sea que el riesgo que el auditor senalo ('6.1 puede tener otro default de
#   POSIX_MQUEUE') existe y va A FAVOR: en 6.1 ya esta en y, asi que IPC_NS deberia
#   sobrevivir con mas margen. INFERIDO hasta que el .config resuelto lo confirme.
#
#   Y el dato que CONFIRMA la advertencia del auditor sobre los slots:
#   en 6.1 el slot 3 YA ESTA USADO (ANDROID_KABI_USE(3, struct {...)), libres 4..8.
#   El parche de F-004c, escrito sobre los slots 3-4-5, NO compilaria aca.
#   F-004d no usa parche, asi que no lo toca. Pero D5 (slots a 6-7-8) queda validado.
on:
  push:
    branches: ['titan/f-004-kmi']
    paths: ['.github/workflows/f-004d-61.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: f004d61-${{ matrix.brazo }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        brazo: [baseline, ocho]
    steps:
      - uses: actions/checkout@v4
      - name: Identificar la maquina, verbatim
        run: |
          set -x
          uname -a
          nproc
          free -m
          df -h /
      - name: md5 de los instrumentos
        run: md5sum tools/f004d_sin_sysvipc.py tools/f004b_kabi.py
      - name: Herramientas de kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm bc bison flex libssl-dev libelf-dev python3 rsync kmod cpio zstd
          clang --version | head -2
      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Compilar en la generacion 6.1
        env:
          F004_OUT: mediciones/f-004d-61
          F004_WORK: /tmp/f004d61
          F004_RAMA: android14-6.1
        run: |
          if [ "${{ matrix.brazo }}" = "baseline" ]; then
            python3 tools/f004b_kabi.py build baseline
          else
            python3 tools/f004d_sin_sysvipc.py build
          fi
      - name: Renombrar por generacion, R-17
        if: always()
        run: |
          set -x
          ls -la mediciones/f-004d-61/ || true
          for f in mediciones/f-004d-61/elf-*.tar.zst; do
            [ -e "$f" ] || continue
            mv -v "$f" "mediciones/f-004d-61/elf-${{ matrix.brazo }}-android14-6.1.tar.zst"
          done
          ls -la mediciones/f-004d-61/ || true
      - name: Subir todo, R-11
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f004d61-${{ matrix.brazo }}
          path: mediciones/f-004d-61/
          retention-days: 5
          if-no-files-found: warn

  comparar:
    name: f004d61-stgdiff-x86
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: titan/f-004-kmi
      - uses: actions/download-artifact@v4
        with:
          pattern: 'f004d61-*'
          path: /tmp/art
      - name: R-11, copiar todo antes de analizar
        run: |
          set -x
          mkdir -p mediciones/f-004d-61
          find /tmp/art -type f | sort
          cp -rv /tmp/art/f004d61-baseline/* mediciones/f-004d-61/ 2>/dev/null || true
          cp -rv /tmp/art/f004d61-ocho/* mediciones/f-004d-61/ 2>/dev/null || true
          ls -la mediciones/f-004d-61/
      - name: Desempaquetar los dos ELF
        run: |
          set -x
          for b in baseline ocho; do
            mkdir -p /tmp/k/$b
            f=$(find /tmp/art mediciones/f-004d-61 -name "elf-$b-android14-6.1.tar.zst" | head -1)
            if [ -n "$f" ]; then tar -x --zstd -f "$f" -C /tmp/k/$b || true; fi
            ls -la /tmp/k/$b | head -3 || true
          done
      - name: stg y stgdiff de la generacion 6.1
        env:
          F004_OUT: mediciones/f-004d-61
          F004_RAMA: android14-6.1
        run: python3 tools/f004d61_stg.py
      - name: Commitear
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f mediciones/f-004d-61/elf-*.tar.zst
          git add -A mediciones
          git diff --cached --quiet && echo 'sin cambios' && exit 0
          git commit -m "evidencia(F-004d@6.1): generacion android14-6.1 (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin titan/f-004-kmi && git push origin HEAD:titan/f-004-kmi && exit 0
            sleep $((i * 8))
          done
          exit 1
      - name: Resumen
        if: always()
        run: tail -45 mediciones/f-004d-61/F-004d-61-VEREDICTO.txt >> "$GITHUB_STEP_SUMMARY" || true

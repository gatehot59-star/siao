name: F-004d ocho simbolos sin parche

# DEFECTO MIO, medido: los runs 34035889816 y 34035926358 murieron con CERO jobs
# creados y con el NOMBRE DEL ARCHIVO en vez del 'name:' del workflow. Esa es la
# firma de YAML que no parseo, no de un job que fallo.
# La causa: un paso se llamaba 'Subir todo (R-11: nada se queda en /tmp)'. Un
# escalar PLANO que contiene ': ' lo lee YAML como un mapping. Va entre comillas.
#
# UN solo build: el baseline no se recompila, se usa mediciones/f-004b/baseline.stg,
# que salio con sha256 identico en dos runs y dos runners.
on:
  push:
    branches: ['titan/f-004-kmi']
    paths:
      - 'tools/f004d_sin_sysvipc.py'
      - 'tools/f004d_stg.py'
      - '.github/workflows/f-004d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  peritaje:
    name: peritaje-cero-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Las tres preguntas del auditor, con grep
        run: |
          set -x
          mkdir -p mediciones/peritaje
          out=mediciones/peritaje/CERO-BUILDS.txt
          cfg=mediciones/f-004-v3/config-baseline.txt
          {
            echo "### fecha $(date -u +%FT%TZ) | maquina $(uname -m)"
            echo "### fuente: $cfg (gki_defconfig PURO del baseline)"
            echo
            echo '=== 1) CGROUP_DEVICE y sus alternativas en el baseline ==='
            grep -E 'CONFIG_CGROUP_|CONFIG_MEMCG|CONFIG_BLK_CGROUP' "$cfg" | sort
            echo
            echo '--- cuantos subsistemas de cgroup estan en =y (dimensionan subsys[]) ---'
            grep -cE '^CONFIG_CGROUP_[A-Z_]+=y$' "$cfg" || true
            echo
            echo '=== 2) el enforcer del KMI y la whitelist ==='
            grep -E 'CONFIG_TRIM_UNUSED_KSYMS|CONFIG_UNUSED_KSYMS_WHITELIST|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG|CONFIG_ANDROID_KABI' "$cfg" | sort
          } | tee "$out"
      - name: Listas de simbolos de Google y licencia de Lindroid
        run: |
          set -x
          out=mediciones/peritaje/CERO-BUILDS.txt
          {
            echo
            echo '=== 3) listas de simbolos KMI que Google publica ==='
            curl -sSL 'https://android.googlesource.com/kernel/common/+/refs/heads/android15-6.6/android?format=TEXT' | base64 -d | awk '{print $NF}' | sort
            echo
            echo '--- tamano de la lista generica y su FORMATO real ---'
            curl -sSL 'https://android.googlesource.com/kernel/common/+/refs/heads/android15-6.6/android/abi_gki_aarch64?format=TEXT' | base64 -d > /tmp/prot.txt || true
            wc -l /tmp/prot.txt || true
            head -12 /tmp/prot.txt || true
            echo
            echo '=== 4) licencia de vendor_lindroid, rama lindroid-22.1 ==='
            for f in LICENSE LICENSE.txt COPYING NOTICE MODULE_LICENSE_APACHE2 Android.bp; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://raw.githubusercontent.com/Linux-on-droid/vendor_lindroid/lindroid-22.1/$f")
              echo "  $f -> HTTP $code"
            done
            echo '--- cabecera de lindroid.mk, donde AOSP pone la licencia ---'
            curl -sSL 'https://raw.githubusercontent.com/Linux-on-droid/vendor_lindroid/lindroid-22.1/lindroid.mk' | head -10
          } | tee -a "$out"
      - name: Commitear el peritaje
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mediciones
          git diff --cached --quiet && exit 0
          git commit -m "medicion(peritaje): CGROUP_DEVICE, listas KMI y licencia Lindroid sin un solo build (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin titan/f-004-kmi && git push origin HEAD:titan/f-004-kmi && exit 0
            sleep $((i * 6))
          done
          exit 1
      - name: Resumen
        if: always()
        run: cat mediciones/peritaje/CERO-BUILDS.txt >> "$GITHUB_STEP_SUMMARY" || true

  build:
    name: f004d-ocho-sin-parche
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Identificar la maquina, verbatim
        run: |
          set -x
          uname -a
          nproc
          free -m
          df -h /
      - name: md5 del instrumento
        run: md5sum tools/f004d_sin_sysvipc.py
      - name: Herramientas de kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm bc bison flex libssl-dev libelf-dev python3 rsync kmod cpio zstd
          clang --version | head -2
      - name: Liberar disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Compilar el fragmento de ocho
        env:
          F004_OUT: mediciones/f-004d
          F004_WORK: /tmp/f004d
          F004_RAMA: android15-6.6
        run: python3 tools/f004d_sin_sysvipc.py build
      - name: 'Subir todo, R-11: nada se queda en /tmp'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f004d-todo
          path: mediciones/f-004d/
          retention-days: 5
          if-no-files-found: warn

  comparar:
    name: f004d-stgdiff-x86
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: titan/f-004-kmi
      - uses: actions/download-artifact@v4
        with:
          name: f004d-todo
          path: /tmp/art
      - name: 'R-11, copiar TODO a mediciones antes de analizar nada'
        run: |
          set -x
          mkdir -p mediciones/f-004d
          find /tmp/art -type f | sort
          cp -rv /tmp/art/* mediciones/f-004d/ 2>/dev/null || true
          ls -la mediciones/f-004d/
      - name: Desempaquetar el ELF
        run: |
          set -x
          mkdir -p /tmp/k/d
          f=$(find /tmp/art mediciones/f-004d -name 'elf-d.tar.zst' | head -1)
          if [ -n "$f" ]; then tar -x --zstd -f "$f" -C /tmp/k/d; fi
          ls -la /tmp/k/d | head -4 || true
      - name: stg y stgdiff contra el baseline commiteado
        run: python3 tools/f004d_stg.py
      - name: Commitear
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f mediciones/f-004d/elf-d.tar.zst
          git add -A mediciones
          git diff --cached --quiet && echo 'sin cambios' && exit 0
          git commit -m "evidencia(F-004d): ocho simbolos sin parche (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin titan/f-004-kmi && git push origin HEAD:titan/f-004-kmi && exit 0
            sleep $((i * 7))
          done
          exit 1
      - name: Resumen
        if: always()
        run: tail -40 mediciones/f-004d/F-004d-VEREDICTO.txt >> "$GITHUB_STEP_SUMMARY" || true

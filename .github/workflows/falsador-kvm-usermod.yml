name: falsador-kvm-usermod

# LA PREGUNTA: en ubuntu-24.04 (x64) el nodo /dev/kvm EXISTE y da Permission
# denied al usuario del runner. Se destraba con permisos?
#
# Por que importa: si se destraba, Actions x64 revive como opcion para el AVD del
# Agent Bridge, y no hay que tocar la VM que sirve el corpus en produccion.
#
# TRES VIAS, y cada una con su medicion propia. No alcanza con "el comando no
# fallo": hay que abrir el device y correr el ioctl.
#   V1. usermod -aG kvm + sg kvm  (el grupo nuevo NO aplica a la sesion actual,
#       por eso hace falta sg o newgrp para re-evaluar los grupos)
#   V2. chmod 666 /dev/kvm        (mas bruto: no depende del grupo)
#   V3. sudo directo              (si ni root puede, el modulo no esta cargado y
#       ninguna via de permisos va a servir)
#
# V3 es el DISCRIMINADOR: separa "problema de permisos" (arreglable) de "KVM no
# esta ahi" (irreparable). Sin V3, un fallo de V1 y V2 no dice cual de las dos.
#
# Y el CREATE_VM importa mas que el api_version: en la VM de Abraham el api dio
# 12 y crear la VM tambien funciono. Un api_version sin CREATE_VM seria KVM a
# medias.

on:
  workflow_dispatch:
  push:
    paths:
      - "disparadores/falsador-kvm-usermod.txt"

jobs:
  destrabar:
    runs-on: ubuntu-24.04
    steps:
      - name: estado inicial
        run: |
          set -uo pipefail
          uname -m
          id
          ls -la /dev/kvm
          echo "--- modulos kvm cargados? ---"
          lsmod 2>/dev/null | grep -i kvm || echo "lsmod: sin kvm"
          echo "--- el grupo kvm existe? ---"
          getent group kvm || echo "no existe el grupo kvm"
          echo "--- sudo sin password? ---"
          sudo -n true && echo SUDO_SIN_PASSWORD || echo SUDO_PIDE_PASSWORD

      - name: V3 primero, el discriminador
        run: |
          set -uo pipefail
          # Va PRIMERO a proposito: si root no puede, V1 y V2 no tienen sentido
          # y el resultado de esas dos seria un rojo sin causa.
          sudo python3 - <<'PY'
          import fcntl, os, json
          res = {"via": "V3-sudo-directo"}
          try:
              f = os.open("/dev/kvm", os.O_RDWR)
              res["abre_rdwr"] = True
              for nombre, num in (("api_version", 0xAE00), ("create_vm", 0xAE01)):
                  try:
                      v = fcntl.ioctl(f, num, 0)
                      res[nombre] = v
                      if nombre == "create_vm":
                          os.close(v)
                  except Exception as e:
                      res[nombre] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
              os.close(f)
          except Exception as e:
              res["abre_rdwr"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
          res["VEREDICTO"] = ("KVM_USABLE_COMO_ROOT"
                              if res.get("api_version") == 12 and isinstance(res.get("create_vm"), int)
                              else "KVM_NO_FUNCIONA_NI_COMO_ROOT")
          print(json.dumps(res, indent=1))
          PY

      - name: V1 usermod + sg
        run: |
          set -uo pipefail
          sudo usermod -aG kvm "$(id -un)" && echo "usermod rc=0"
          echo "grupos declarados AHORA: $(id -Gn)"
          echo "grupos del usuario en /etc/group: $(id -Gn "$(id -un)")"
          # el grupo nuevo no aplica a esta sesion: sg re-evalua
          sg kvm -c 'python3 - <<PY
          import fcntl, os, json
          res = {"via": "V1-usermod-sg", "grupos": os.getgroups()}
          try:
              f = os.open("/dev/kvm", os.O_RDWR)
              res["abre_rdwr"] = True
              try:
                  res["api_version"] = fcntl.ioctl(f, 0xAE00, 0)
              except Exception as e:
                  res["api_version"] = "ERR:" + type(e).__name__
              try:
                  vm = fcntl.ioctl(f, 0xAE01, 0); res["create_vm"] = vm; os.close(vm)
              except Exception as e:
                  res["create_vm"] = "ERR:" + type(e).__name__
              os.close(f)
          except Exception as e:
              res["abre_rdwr"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
          res["VEREDICTO"] = ("DESTRABADO" if isinstance(res.get("create_vm"), int) else "SIGUE_TRABADO")
          print(json.dumps(res, indent=1))
          PY'

      - name: V2 chmod 666
        run: |
          set -uo pipefail
          sudo chmod 666 /dev/kvm && echo "chmod rc=0"
          ls -la /dev/kvm
          python3 - <<'PY'
          import fcntl, os, json
          res = {"via": "V2-chmod-666", "escribible": os.access("/dev/kvm", os.W_OK)}
          try:
              f = os.open("/dev/kvm", os.O_RDWR)
              res["abre_rdwr"] = True
              try:
                  res["api_version"] = fcntl.ioctl(f, 0xAE00, 0)
              except Exception as e:
                  res["api_version"] = "ERR:" + type(e).__name__
              try:
                  vm = fcntl.ioctl(f, 0xAE01, 0)
                  res["create_vm"] = vm
                  os.close(vm)
              except Exception as e:
                  res["create_vm"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
              os.close(f)
          except Exception as e:
              res["abre_rdwr"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
          res["VEREDICTO"] = ("DESTRABADO" if isinstance(res.get("create_vm"), int) else "SIGUE_TRABADO")
          print(json.dumps(res, indent=1))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### V2 chmod 666" + chr(10) + "```json" + chr(10) +
                       json.dumps(res, indent=1) + chr(10) + "```" + chr(10))
          PY

      - name: prueba de uso REAL, no de permisos
        run: |
          set -uo pipefail
          # El ioctl prueba que KVM responde. Esto prueba que SIRVE: el emulador
          # de Android es el consumidor real, y su propio comando de diagnostico
          # es la unica medicion que importa para SIAO.
          echo "ANDROID_HOME=${ANDROID_HOME:-vacio}"
          EMU="${ANDROID_HOME:-/usr/local/lib/android/sdk}/emulator/emulator"
          if [ -x "${EMU}" ]; then
            echo "--- emulator -accel-check ---"
            "${EMU}" -accel-check 2>&1 | head -5 || true
            echo "rc=$?"
          else
            echo "emulator AUSENTE en ${EMU}: se mide con sdkmanager aparte"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>&1 | head -10
          fi

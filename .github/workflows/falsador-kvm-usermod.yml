name: falsador-kvm-usermod

# LA PREGUNTA: en ubuntu-24.04 (x64) el nodo /dev/kvm EXISTE y da Permission
# denied al usuario del runner. Se destraba con permisos?
#
# Por que importa: si se destraba, Actions x64 revive como opcion para el AVD del
# Agent Bridge, y no hay que tocar la VM que sirve el corpus en produccion.
#
# TRES VIAS, cada una con su medicion propia. No alcanza con "el comando no
# fallo": hay que abrir el device y correr el ioctl.
#   V3. sudo directo   -> va PRIMERO porque es el DISCRIMINADOR: separa
#       "problema de permisos" (arreglable) de "KVM no esta ahi" (irreparable).
#   V1. usermod -aG kvm + sg kvm  (el grupo nuevo NO aplica a la sesion actual)
#   V2. chmod 666 /dev/kvm        (no depende del grupo)
#
# Y el CREATE_VM importa mas que el api_version: en la VM de Abraham el api dio
# 12 y crear la VM tambien funciono. Un api_version sin CREATE_VM seria KVM a
# medias.
#
# DEFECTO PROPIO CAZADO ANTES DE CORRER: la v1 de este workflow metia un heredoc
# `<<PY` DENTRO de `sg kvm -c '...'`. El validador (instrumentos/validar_workflow.py
# del repo del corpus) lo marco ROJO: "heredoc sin cierre PY". Un heredoc anidado
# dentro de comillas simples no se cierra. Ahora el probe se escribe a un archivo
# y `sg` solo lo ejecuta, que ademas hace el probe reutilizable por las tres vias.
#
# ===================================================================
# HARDENING 2026-09-08 · H-06 de la auditoria de Tao
# ===================================================================
#
# 1. `permissions: contents: read`. Antes no habia bloque, asi que el
#    GITHUB_TOKEN heredaba el default del repo. Este workflow no escribe NADA al
#    repo, asi que read es el minimo REAL, no una eleccion conservadora.
#
# 2. `timeout-minutes: 15`. Sin el, el tope es el default de SEIS HORAS, y esta
#    corrida tarda ~1 min. Un ioctl colgado se comia seis horas de cuota.
#
# 3. El guard del `chmod 666 /dev/kvm`, que es el punto que Tao marco con razon.
#    Hoy este workflow declara `runs-on: ubuntu-24.04`, o sea un runner HOSTED y
#    efimero: la maquina se destruye y el 666 se va con ella. **El riesgo es de
#    reutilizacion**: el ecosistema ya opera un runner self-hosted en
#    `mudh-mobile`, y basta cambiar una label o copiar este archivo para dejar
#    /dev/kvm WORLD-WRITABLE de forma PERSISTENTE en una maquina real.
#
#    Y EL GUARD TRAE SU PROPIO TESTIGO, que es lo que lo hace distinto de un
#    `if:` cualquiera: hoy mismo, en este proyecto, encontramos un guard que
#    corrio, devolvio rc=0 y NO HIZO TRABAJO (el `archscripts` del Error 126, con
#    `segundos: 0.02` y `Nothing to be done`). La leccion quedo escrita: **un
#    paso de mitigacion que no hace trabajo no mitigo nada.** Un `if:` que saltea
#    en silencio es la misma familia, asi que el paso siguiente MIDE si V2 corrio
#    o se salteo, y lo dice. Si la expresion `runner.environment` estuviera mal
#    escrita, se ve en el resumen en vez de pasar por verde.
#
#    NO MEDIDO: la expresion `runner.environment == 'github-hosted'` no se
#    verifico en corrida. El paso 0 la imprime justamente para cerrar eso en la
#    proxima.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "disparadores/falsador-kvm-usermod.txt"

jobs:
  destrabar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: paso 0 - de que entorno es este runner (hace medible el guard)
        run: |
          set -uo pipefail
          echo "runner.environment = '${{ runner.environment }}'"
          echo "runner.os          = '${{ runner.os }}'"
          echo "runner.arch        = '${{ runner.arch }}'"
          {
            echo "### entorno del runner"
            echo "- \`runner.environment\` = \`${{ runner.environment }}\`"
            echo "- el paso V2 (chmod 666) corre SOLO si esto vale \`github-hosted\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: estado inicial
        run: |
          set -uo pipefail
          uname -m
          id
          ls -la /dev/kvm
          echo "--- modulos kvm cargados? ---"
          lsmod 2>/dev/null | grep -i kvm || echo "lsmod: sin kvm"
          echo "--- el grupo kvm existe? ---"
          getent group kvm || echo "no existe el grupo kvm"
          echo "--- sudo sin password? ---"
          sudo -n true && echo SUDO_SIN_PASSWORD || echo SUDO_PIDE_PASSWORD

      - name: escribir el probe UNA vez
        run: |
          set -uo pipefail
          cat > /tmp/probe_kvm.py <<'PY'
          import fcntl, json, os, sys
          res = {"via": sys.argv[1] if len(sys.argv) > 1 else "?",
                 "uid": os.getuid(), "grupos": sorted(os.getgroups()),
                 "existe": os.path.exists("/dev/kvm"),
                 "escribible": os.access("/dev/kvm", os.W_OK)}
          try:
              f = os.open("/dev/kvm", os.O_RDWR)
              res["abre_rdwr"] = True
              try:
                  res["api_version"] = fcntl.ioctl(f, 0xAE00, 0)
              except Exception as e:
                  res["api_version"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
              try:
                  vm = fcntl.ioctl(f, 0xAE01, 0)
                  res["create_vm"] = vm
                  os.close(vm)
              except Exception as e:
                  res["create_vm"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
              os.close(f)
          except Exception as e:
              res["abre_rdwr"] = "ERR:" + type(e).__name__ + ":" + str(e)[:70]
          res["VEREDICTO"] = ("KVM_USABLE"
                              if res.get("api_version") == 12 and isinstance(res.get("create_vm"), int)
                              else "KVM_PARCIAL" if isinstance(res.get("api_version"), int)
                              else "TRABADO")
          print(json.dumps(res, indent=1))
          resumen = os.environ.get("GITHUB_STEP_SUMMARY")
          if resumen:
              with open(resumen, "a") as fh:
                  fh.write("### " + res["via"] + chr(10) + "```json" + chr(10) +
                           json.dumps(res, indent=1) + chr(10) + "```" + chr(10))
          PY
          chmod +x /tmp/probe_kvm.py
          python3 -c "import ast;ast.parse(open('/tmp/probe_kvm.py').read());print('PROBE_SINTAXIS_OK')"

      - name: V3 sudo directo, el discriminador
        run: |
          set -uo pipefail
          # Si root NO puede, V1 y V2 no tienen sentido y su rojo no tendria causa.
          sudo python3 /tmp/probe_kvm.py V3-sudo-directo

      - name: V1 usermod + sg
        run: |
          set -uo pipefail
          sudo usermod -aG kvm "$(id -un)" && echo "usermod rc=0"
          echo "grupos de ESTA sesion : $(id -Gn)"
          echo "grupos en /etc/group  : $(id -Gn "$(id -un)")"
          # el grupo nuevo no aplica a la sesion actual: sg lo re-evalua
          sg kvm -c 'python3 /tmp/probe_kvm.py V1-usermod-sg'

      # SOLO en runner hosted y efimero. En un self-hosted esto dejaria /dev/kvm
      # world-writable de forma permanente, que es el riesgo real que Tao marco.
      - name: V2 chmod 666 (SOLO hosted)
        if: runner.environment == 'github-hosted'
        run: |
          set -uo pipefail
          sudo chmod 666 /dev/kvm && echo "chmod rc=0"
          ls -la /dev/kvm
          python3 /tmp/probe_kvm.py V2-chmod-666
          touch /tmp/V2_CORRIO

      - name: el guard hizo trabajo? (testigo del if, no del comando)
        if: always()
        run: |
          set -uo pipefail
          # Este paso existe por una cicatriz de HOY: un guard que corre, devuelve
          # rc=0 y no hace trabajo se lee igual que uno que funciono. Aca el
          # marcador distingue "V2 corrio" de "V2 se salteo" de "V2 fallo".
          if [ -f /tmp/V2_CORRIO ]; then
            EST="V2_CORRIO (runner hosted, el chmod se aplico)"
          else
            EST="V2_SALTEADO (el guard lo bloqueo, o el paso fallo antes del touch)"
          fi
          echo "$EST"
          echo "runner.environment fue '${{ runner.environment }}'"
          echo "modo actual de /dev/kvm:"
          ls -la /dev/kvm 2>&1 || echo "/dev/kvm AUSENTE"
          {
            echo "### testigo del guard"
            echo "- $EST"
            echo "- \`runner.environment\` = \`${{ runner.environment }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: prueba de USO REAL, no de permisos
        run: |
          set -uo pipefail
          # El ioctl prueba que KVM responde. Esto prueba que SIRVE: el emulador
          # de Android es el consumidor real y su propio diagnostico es la unica
          # medicion que importa para SIAO.
          echo "ANDROID_HOME=${ANDROID_HOME:-vacio}"
          EMU="${ANDROID_HOME:-/usr/local/lib/android/sdk}/emulator/emulator"
          if [ -x "${EMU}" ]; then
            echo "--- emulator -accel-check ---"
            "${EMU}" -accel-check 2>&1 | head -6 || true
          else
            echo "emulator AUSENTE en ${EMU}"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>&1 | head -12
          fi
